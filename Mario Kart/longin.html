<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Kart</title>


    <style>

        @font-face {
    font-family:'mayro';
    src: url(fonts/MayroKartRetro-Regular.ttf);
}

        body{

           margin: 0%;
           font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #ecd51a, #ff6c06);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            
        }

        

        .login{

            

            background-color: #ffffff;
            width: 350px;
            padding: 100px;
            border-radius: 15px;
            text-align: center;
        }

        h1{
            font-family: mayro;
            color: #ecd51a;
            font-size: 50px;
            
        
        }

           
            
        p{
             color: #ecd51a;}

        input{

            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-sizing: border-box;
            
        }

        button{

            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #ff6c06;
            font-weight: bold;
            cursor:pointer;
            font-size: 20px;
        }   
        button:hover{

            background: #cf5b08;
        }

        a{

            text-decoration: none;
            color: #ecd51a;
            
        }

       

            

        
    </style>
</head>
<body>

    <div class="login">

        <h1> Mario Kart </h1>

        <p> Entre na sua conta </p>

        <form action="home.html"> 

            <input type="email" placeholder="Digite seu e-mail">

            <input type="password" placeholder="Digite sua senha">

            <button type="submit"> Entrar </button>

            </form>

            <p>
                <a href="#"> Criar Contas</a>
            </p>
        
        
    
    </div>
    
</body>
</html>
